<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bhaskar Food</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html{scroll-behavior:smooth}
.dish-card{transition:transform 0.15s}.dish-card:active{transform:scale(0.95)}
#trackMap{height:200px;width:100%;border-radius:16px;z-index:1}
.pdot{width:14px;height:14px;background:#dc2626;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 0 rgba(220,38,38,.4);animation:pp 1.5s infinite}
@keyframes pp{0%{box-shadow:0 0 0 0 rgba(220,38,38,.4)}70%{box-shadow:0 0 0 12px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
/* Fix Leaflet control overlay issues */
.leaflet-control-container { z-index: 10 !important; }
</style>
</head>
<body class="bg-gray-100 text-gray-800" style="padding-bottom:100px">

<header class="bg-white p-4 shadow-sm sticky top-0 z-50 flex justify-between items-center border-b-4 border-red-600 gap-2">
  <div class="flex flex-col min-w-0">
    <h1 class="text-2xl font-black text-red-600 italic uppercase leading-none tracking-tight">Bhaskar Food</h1>
    <p class="text-xs sm:text-sm font-semibold text-slate-600 tracking-wide mt-1 leading-tight truncate">
      Delivery Services At <span class="text-red-600 font-bold">Where You Are.</span>
    </p>
  </div>
  <button onclick="location.reload()" class="text-[10px] font-bold bg-gray-100 px-3 py-2 rounded-full uppercase shrink-0 hover:bg-gray-200 transition-colors">Refresh</button>
</header>

<div id="customer-list" class="p-4 space-y-8"></div>

<div id="bottom-bill-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.1)] p-4 z-[90] flex justify-between items-center border-t border-gray-200">
  <div>
    <p class="text-[10px] font-black text-gray-400 uppercase tracking-wider">Total Bill</p>
    <p id="panel-total" class="text-2xl font-black text-green-600">₹0</p>
  </div>
  <div class="flex items-center gap-3">
    <button id="cancelBtn" class="text-red-500 font-bold text-xs uppercase bg-red-50 px-4 py-3 rounded-xl active:scale-95 transition-transform">Clear</button>
    <button id="proceedBtn" class="bg-red-600 text-white px-6 py-3 rounded-xl font-black text-sm uppercase shadow-md active:scale-95 transition-transform flex items-center gap-2">
      Proceed <i class="fas fa-arrow-right text-xs"></i>
    </button>
  </div>
</div>

<div id="checkout-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm">
  <div class="bg-white w-full max-w-md rounded-t-[2.5rem] sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto transform transition-all">
    
    <div class="flex justify-between items-center mb-5 border-b pb-3">
      <h3 class="text-lg font-black text-gray-800 uppercase italic">Delivery Details</h3>
      <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600 p-2"><i class="fas fa-times text-xl"></i></button>
    </div>

    <div class="space-y-4">
      <input id="custName" type="text" placeholder="Your Full Name *" class="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 font-bold text-sm focus:outline-none focus:border-red-400"/>
      <input id="custPhone" type="tel" placeholder="Your Phone Number *" class="w-full p-4 border border-gray-200 rounded-2xl bg-gray-50 font-bold text-sm focus:outline-none focus:border-red-400"/>

      <div class="bg-red-50 rounded-2xl p-4 border border-red-100 space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <p class="font-black text-sm text-gray-800">📍 Live Location</p>
            <p class="text-[11px] text-gray-500 mt-0.5" id="locStatusText">Share GPS coordinates for fast delivery</p>
          </div>
          <button id="locBtn" class="bg-red-600 text-white px-4 py-2 rounded-xl font-black text-xs uppercase active:scale-95 transition-transform shrink-0">Share GPS</button>
        </div>

        <div class="bg-white rounded-xl p-3 border border-red-100">
          <div class="flex items-center justify-between">
            <p class="text-[10px] font-black text-gray-500 uppercase">📡 Service Radius Limit</p>
            <span id="radiusVal" class="font-black text-red-600 text-xs">Loading…</span>
          </div>
          <div class="bg-gray-100 rounded-full h-1.5 mt-1.5">
            <div id="radiusBar" class="bg-red-500 h-1.5 rounded-full transition-all" style="width:20%"></div>
          </div>
        </div>

        <div id="mapWrap" class="hidden space-y-2">
          <div id="trackMap"></div>
          <div class="flex items-center gap-2 bg-green-50 border border-green-200 rounded-xl px-3 py-2">
            <div class="pdot flex-shrink-0"></div>
            <p class="text-xs font-bold text-green-700 line-clamp-1" id="locAddress">Getting address…</p>
          </div>
        </div>
      </div>

      <div class="pt-2">
        <div class="flex justify-between items-center mb-3 px-1">
          <span class="text-gray-500 font-bold text-sm">Grand Total Amount:</span>
          <span id="modal-total" class="text-2xl font-black text-green-600">₹0</span>
        </div>
        <button id="placeOrderBtn" class="w-full bg-red-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 transition-transform text-base tracking-wide">🛵 Confirm & Order Now</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyAT074ME7aIbb4R2VzgZZGdw8F3alL-xbA",
  authDomain:"bhaskar-food-app.firebaseapp.com",
  databaseURL:"https://bhaskar-food-app-default-rtdb.firebaseio.com",
  projectId:"bhaskar-food-app",
  appId:"1:712053690568:web:b4d8b789e0359ebc0e95fd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ── STATE ── */
let cart={}, resData={}, myLat=null, myLng=null, myAddress='';
let watchId=null, trackMap=null, myMarker=null, myCircle=null;
let radiusM=200, orderLat=null, orderLng=null, wasOutside=false;
let activeOid=null, speechReady=false;

/* ── VOICE ── */
function speak(txt, urgent=false){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='en-IN'; u.rate=urgent?.85:.95; u.pitch=urgent?1.2:1; u.volume=1;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(x=>x.lang.startsWith('en'));
  if(v) u.voice=v;
  window.speechSynthesis.speak(u);
}
function initSpeech(){
  if(speechReady) return; speechReady=true;
  window.speechSynthesis.getVoices();
  const w=new SpeechSynthesisUtterance(' '); w.volume=0; window.speechSynthesis.speak(w);
}
document.addEventListener('click', initSpeech, {once:true});

function showBanner(msg, color){
  let b=document.getElementById('cBanner');
  if(!b){ b=document.createElement('div'); b.id='cBanner';
    b.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 20px;border-radius:14px;font-weight:800;font-size:13px;text-align:center;max-width:90vw;transition:opacity .4s;box-shadow:0 4px 20px rgba(0,0,0,.2)';
    document.body.appendChild(b); }
  b.textContent=msg; b.style.background=color==='red'?'#dc2626':'#16a34a'; b.style.color='#fff'; b.style.opacity='1';
  clearTimeout(b._t); b._t=setTimeout(()=>b.style.opacity='0',4500);
}

/* ── RADIUS FROM FIREBASE ── */
onValue(ref(db,'settings/serviceRadius'), snap=>{
  const v=parseInt(snap.val())||200; radiusM=v;
  document.getElementById('radiusVal').textContent=v+' m';
  document.getElementById('radiusBar').style.width=((v-50)/(1000-50)*100)+'%';
  if(myCircle) myCircle.setRadius(v);
});

/* ── GPS ── */
document.getElementById('locBtn').addEventListener('click', ()=>{
  const btn=document.getElementById('locBtn');
  if(!navigator.geolocation){ alert('GPS not supported'); return; }
  btn.textContent='⏳ Getting…'; btn.disabled=true;
  navigator.geolocation.getCurrentPosition(pos=>{
    myLat=pos.coords.latitude; myLng=pos.coords.longitude;
    btn.textContent='✅ Sharing'; btn.disabled=false;
    btn.classList.replace('bg-red-600','bg-green-600');
    document.getElementById('locStatusText').textContent='✅ Live location sharing ON';
    showMap(); reverseGeocode(myLat,myLng);
    if(watchId) navigator.geolocation.clearWatch(watchId);
    watchId=navigator.geolocation.watchPosition(p=>{
      myLat=p.coords.latitude; myLng=p.coords.longitude;
      updatePin(myLat,myLng); reverseGeocode(myLat,myLng);
      checkBreach(myLat,myLng);
      if(activeOid){ set(ref(db,`orders/${activeOid}/lat`),myLat); set(ref(db,`orders/${activeOid}/lng`),myLng); }
    },null,{enableHighAccuracy:true,maximumAge:8000});
  },()=>{ btn.textContent='Share GPS'; btn.disabled=false; alert('Location denied. Please allow GPS.'); },{enableHighAccuracy:true});
});

function showMap(){
  document.getElementById('mapWrap').classList.remove('hidden');
  if(!trackMap){
    trackMap=L.map('trackMap',{zoomControl:true,attributionControl:false}).setView([myLat,myLng],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(trackMap);
  }
  updatePin(myLat,myLng);
  setTimeout(()=>trackMap.invalidateSize(),200);
}
function updatePin(lat,lng){
  if(!trackMap) return;
  const icon=L.divIcon({html:'<div class="pdot"></div>',iconSize:[14,14],className:''});
  if(myMarker) myMarker.setLatLng([lat,lng]);
  else myMarker=L.marker([lat,lng],{icon}).addTo(trackMap).bindPopup('📍 You are here');
  if(myCircle){ myCircle.setLatLng([lat,lng]); myCircle.setRadius(radiusM); }
  else myCircle=L.circle([lat,lng],{radius:radiusM,color:'#dc2626',fillColor:'#dc2626',fillOpacity:.1,weight:2}).addTo(trackMap);
  trackMap.setView([lat,lng],16);
}
function reverseGeocode(lat,lng){
  // Added standard user-agent parameter mapping to avoid Nominatim blacklisting blocks
  fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=en`)
    .then(r=>r.json()).then(d=>{
      const a=d.address||{};
      myAddress=[a.road||a.suburb||'',a.city||a.town||a.village||'',a.state||''].filter(Boolean).join(', ');
      document.getElementById('locAddress').textContent='📍 '+(myAddress||`${lat.toFixed(5)},${lng.toFixed(5)}`);
    }).catch(()=>{ myAddress=`${lat.toFixed(5)},${lng.toFixed(5)}`; document.getElementById('locAddress').textContent='📍 '+myAddress; });
}

/* ── HAVERSINE ── */
function getDist(a,b,c,d){
  const R=6371000,dL=(c-a)*Math.PI/180,dG=(d-b)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dG/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)));
}

/* ── BREACH CHECK ── */
function checkBreach(lat,lng){
  // Safe validation check added to prevent app crashes before an order is confirmed
  if(!orderLat||!orderLng) return;
  const dist=getDist(lat,lng,orderLat,orderLng);
  const out=dist>radiusM;
  const st=document.getElementById('locStatusText');
  if(out&&!wasOutside){
    wasOutside=true;
    speak('Warning! You are crossing the service area. Please stay within the delivery zone.',true);
    showBanner('⚠️ You are crossing the service area!','red');
    if(st){ st.textContent=`⚠️ Outside radius! (${dist}m away)`; st.classList.add('text-red-600'); }
  } else if(!out&&wasOutside){
    wasOutside=false;
    speak('You are back in the service area. Thank you!');
    showBanner('✅ You are back in the service area!','green');
    if(st){ st.textContent=`✅ Inside radius (${dist}m from start)`; st.classList.remove('text-red-600'); }
  } else if(out && st){
    st.textContent=`⚠️ Outside radius! (${dist}m away)`;
  } else if(st){
    st.textContent=`✅ Live location sharing ON (${dist}m from start)`;
  }
}

/* ── DISH MAP (JS store, not DOM) ── */
const dishMap = {};

/* ── CART ── */
function updateQty(id, change){
  initSpeech();
  const info = dishMap[id];
  if(!info) return;
  if(!cart[id]) cart[id]={ dish: info.dish, price: info.price, qty: 0 };
  
  const currentQty = cart[id].qty;
  
  if(change > 0 && currentQty >= 20) {
    showBanner('⚠️ Maximum quantity limit is 20!', 'red');
    return;
  }
  
  cart[id].qty += change;
  if(cart[id].qty <= 0) delete cart[id];
  updateUI();
  updateCardQty(id);
}

function updateCardQty(id){
  const row = document.querySelector(`[data-mid="${id}"]`);
  if(!row) return;
  const qty = cart[id] ? cart[id].qty : 0;
  
  row.innerHTML = `
    <button class="qMinus w-8 h-8 bg-red-100 text-red-600 rounded-lg font-black text-lg flex items-center justify-center active:scale-90">−</button>
    <span class="font-black text-sm text-gray-800">${qty}</span>
    <button class="qPlus w-8 h-8 bg-red-500 text-white rounded-lg font-black text-lg flex items-center justify-center active:scale-90">${qty >= 20 ? '✕' : '+'}</button>`;
}

/* Modals Trigger Visibility Actions */
const modal = document.getElementById('checkout-modal');
document.getElementById('proceedBtn').addEventListener('click', () => {
  modal.classList.remove('hidden');
  if(myLat) setTimeout(() => { if(trackMap) trackMap.invalidateSize(); }, 250);
});
document.getElementById('closeModalBtn').addEventListener('click', () => modal.classList.add('hidden'));

document.getElementById('cancelBtn').addEventListener('click', ()=>{
  cart={};
  if(watchId){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  updateUI();
  modal.classList.add('hidden');
  document.querySelectorAll('[data-mid]').forEach(row=>{
    updateCardQty(row.dataset.mid);
  });
});

function updateUI(){
  const total=Object.values(cart).reduce((s,i)=>s+(i.price*i.qty),0);
  const bottomBar=document.getElementById('bottom-bill-bar');
  
  bottomBar.style.display = total > 0 ? 'flex' : 'none';
  document.getElementById('panel-total').innerText = '₹' + total;
  document.getElementById('modal-total').innerText = '₹' + total;
}

/* ── EVENT DELEGATION ── */
document.getElementById('customer-list').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  const row = btn.closest('[data-mid]');
  if(!row) return;
  const mid = row.dataset.mid;
  if(btn.classList.contains('qPlus'))  updateQty(mid, +1);
  if(btn.classList.contains('qMinus')) updateQty(mid, -1);
});

/* ── RENDER MENU ── */
function renderMenu(){
  const container=document.getElementById('customer-list');
  container.innerHTML='';
  Object.keys(resData).forEach(resId=>{
    const res=resData[resId];
    let html='';
    if(res.menu){
      Object.keys(res.menu).forEach(mId=>{
        const m=res.menu[mId];
        const price=parseInt(m.price)||0;
        dishMap[mId]={ dish: m.dish, price };
        const qty = cart[mId] ? cart[mId].qty : 0;
        
        const qtyHtml = `<button class="qMinus w-8 h-8 bg-red-100 text-red-600 rounded-lg font-black text-lg flex items-center justify-center active:scale-90">−</button>
             <span class="font-black text-sm text-gray-800">${qty}</span>
             <button class="qPlus w-8 h-8 bg-red-500 text-white rounded-lg font-black text-lg flex items-center justify-center active:scale-90">+</button>`;
             
        html+=`<div class="dish-card bg-white rounded-2xl p-2 border flex flex-col items-center shadow-sm">
          <img src="${m.dishImg||''}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'" class="w-full aspect-square rounded-xl object-cover mb-2"/>
          <p class="font-bold text-[11px] h-8 text-center line-clamp-2">${m.dish}</p>
          <p class="text-red-600 font-black text-xs mb-2">₹${m.price}</p>
          <div class="w-full flex items-center justify-between gap-1" data-mid="${mId}">${qtyHtml}</div>
        </div>`;
      });
    }
    const wrap=document.createElement('div');
    wrap.className='bg-white rounded-[3rem] shadow-sm border overflow-hidden';
    wrap.innerHTML=`<img src="${res.image||''}" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400'" class="w-full h-44 object-cover"/>
      <div class="p-6">
        <h2 class="text-xl font-black text-gray-800 uppercase italic mb-6 border-l-4 border-red-500 pl-3">${res.name}</h2>
        <div class="grid grid-cols-2 gap-4">${html}</div>
      </div>`;
    container.appendChild(wrap);
  });
}

onValue(ref(db,'restaurants'), snap=>{ resData=snap.val()||{}; renderMenu(); });

/* ── PLACE ORDER ── */
document.getElementById('placeOrderBtn').addEventListener('click', async ()=>{
  const name=document.getElementById('custName').value.trim();
  const phone=document.getElementById('custPhone').value.trim();
  if(!name)  { alert('⚠️ Please enter your name!'); return; }
  if(!phone) { alert('⚠️ Please enter your phone number!'); return; }
  if(phone.replace(/\D/g,'').length<10){ alert('⚠️ Please enter a valid 10-digit phone number!'); return; }
  if(!myLat) { alert('⚠️ Please share your live location first!'); return; }

  orderLat=myLat; orderLng=myLng; wasOutside=false;
  const items=Object.values(cart).map(i=>`${i.dish} x${i.qty}`).join(', ');
  const total=Object.values(cart).reduce((s,i)=>s+(i.price*i.qty),0);
  const oid=push(ref(db,'orders')).key;
  activeOid=oid;

  await set(ref(db,'orders/'+oid),{
    id:oid, customerName:name, customerPhone:phone,
    items, totalAmount:total, status:'pending',
    lat:myLat, lng:myLng, address:myAddress,
    radiusMeters:radiusM, timestamp:Date.now()
  });

  if(watchId){
    navigator.geolocation.clearWatch(watchId);
    watchId=navigator.geolocation.watchPosition(p=>{
      myLat=p.coords.latitude; myLng=p.coords.longitude;
      set(ref(db,`orders/${oid}/lat`),myLat);
      set(ref(db,`orders/${oid}/lng`),myLng);
      checkBreach(myLat,myLng);
    },null,{enableHighAccuracy:true,maximumAge:8000});
  }

  speak('Order placed successfully! Your delivery is on the way.');
  showBanner(`✅ Order placed! Total: ₹${total}`,'green');
  cart={}; updateUI();
  modal.classList.add('hidden');
  document.querySelectorAll('[data-mid]').forEach(row=>updateCardQty(row.dataset.mid));
});
</script>
</body>
</html>
