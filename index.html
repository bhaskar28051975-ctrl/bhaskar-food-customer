<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Delivery App - Order Online</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-28">

  <!-- Header -->
  <header class="bg-white shadow sticky top-0 z-30 px-4 py-3 flex justify-between items-center">
    <div>
      <h1 class="font-black text-base text-red-600 uppercase tracking-wide">🍽️ Online Food Ordering</h1>
      <p class="text-[10px] text-gray-400 font-bold">Fresh food delivered to your doorstep</p>
    </div>
    <a href="admin.html" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-xl font-black text-xs">👑 Admin</a>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-6" id="appContainer">
    <div class="text-center py-12 text-gray-400 text-xs font-bold">Loading menus...</div>
  </main>

  <!-- Floating Cart Bar -->
  <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-2xl p-4 z-40 hidden">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-[10px] text-gray-400 font-bold uppercase" id="cartItemCount">0 Items</p>
        <p class="font-black text-base text-gray-900" id="cartTotalPrice">₹0</p>
      </div>
      <button onclick="openCheckoutModal()" class="bg-green-600 text-white px-6 py-3 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95">Checkout via WhatsApp ➔</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col justify-end sm:justify-center sm:items-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-black text-sm uppercase text-gray-800">Complete Your Order</h3>
        <button onclick="closeCheckoutModal()" class="w-8 h-8 bg-gray-100 rounded-full font-bold text-xs text-gray-600">✕</button>
      </div>
      
      <div class="space-y-3 overflow-y-auto flex-1 text-xs">
        <div>
          <label class="font-bold text-gray-600 block mb-1">Your Name *</label>
          <input type="text" id="custName" placeholder="Enter your full name" class="w-full p-3 bg-gray-50 border rounded-xl font-medium outline-none focus:border-red-500">
        </div>
        <div>
          <label class="font-bold text-gray-600 block mb-1">Delivery Address / Room No *</label>
          <textarea id="custAddress" rows="2" placeholder="House no, street, landmark..." class="w-full p-3 bg-gray-50 border rounded-xl font-medium outline-none focus:border-red-500"></textarea>
        </div>
        <div>
          <label class="font-bold text-gray-600 block mb-1">Phone Number *</label>
          <input type="tel" id="custPhone" placeholder="10-digit mobile number" class="w-full p-3 bg-gray-50 border rounded-xl font-medium outline-none focus:border-red-500">
        </div>

        <div class="bg-gray-50 p-3 rounded-2xl border space-y-1">
          <p class="font-bold text-gray-700">Order Summary:</p>
          <div id="modalOrderSummary" class="text-gray-500 space-y-1 max-h-32 overflow-y-auto"></div>
        </div>
      </div>

      <button onclick="submitWhatsAppOrder()" class="w-full bg-green-600 text-white py-3.5 rounded-2xl font-black text-xs uppercase shadow-lg active:scale-95">Send Order on WhatsApp 🚀</button>
    </div>
  </div>

  <script>
    // Initialize Firebase (Ensure this matches your Firebase database URL)
    const firebaseConfig = {
      databaseURL: "https://shirdi-project-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let restaurantsData = {};
    let cart = {}; // format: { dishId: { name, price, qty, restaurantId, restaurantName } }

    // Load Restaurants & Menus in Custom Sorted Order
    db.ref('restaurants').on('value', function(snapshot) {
      const container = document.getElementById('appContainer');
      container.innerHTML = '';
      
      if (!snapshot.exists()) {
        container.innerHTML = '<p class="text-center text-gray-400 text-sm py-12">No restaurants available right now.</p>';
        return;
      }

      restaurantsData = snapshot.val();

      // Sort hotels by 'order' property
      const sortedResKeys = Object.keys(restaurantsData).sort((a, b) => {
        let oA = restaurantsData[a].order !== undefined ? restaurantsData[a].order : 0;
        let oB = restaurantsData[b].order !== undefined ? restaurantsData[b].order : 0;
        return oA - oB;
      });

      sortedResKeys.forEach(resId => {
        const res = restaurantsData[resId];
        const resCard = document.createElement('div');
        resCard.className = 'bg-white rounded-3xl shadow-sm border p-4 space-y-4';

        // Hotel Header
        let hotelHtml = `
          <div class="flex items-center gap-3 border-b pb-3">
            <img src="${res.image || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400'}" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400'" class="w-16 h-16 rounded-2xl object-cover shadow-sm"/>
            <div>
              <h2 class="font-black text-base text-gray-900 uppercase">${res.name}</h2>
              <p class="text-[10px] text-gray-400 font-bold">Delicious items freshly prepared</p>
            </div>
          </div>
          <div class="space-y-3">
        `;

        if (res.menu) {
          // Sort menu items by 'order' property
          const sortedMenuKeys = Object.keys(res.menu).sort((a, b) => {
            let oA = res.menu[a].order !== undefined ? res.menu[a].order : 0;
            let oB = res.menu[b].order !== undefined ? res.menu[b].order : 0;
            return oA - oB;
          });

          sortedMenuKeys.forEach(mId => {
            const m = res.menu[mId];
            const isOos = !!m.outOfStock;
            const price = parseFloat(m.price) || 0;
            const qty = cart[mId] ? cart[mId].qty : 0;

            hotelHtml += `
              <div class="flex items-center gap-3 p-2 rounded-2xl bg-gray-50/80 border">
                <img src="${m.dishImg || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'" class="w-14 h-14 rounded-xl object-cover flex-shrink-0" style="${isOos ? 'filter:grayscale(80%)' : ''}"/>
                <div class="flex-1 min-w-0">
                  <p class="font-black text-xs text-gray-800 truncate">${m.dish}</p>
                  <p class="text-red-600 font-bold text-xs mt-0.5">₹${price}</p>
                  ${isOos ? '<span class="text-[9px] font-black text-red-500 uppercase">Out of Stock</span>' : ''}
                </div>
                <div>
                  ${isOos ? '' : (qty === 0 ? `
                    <button onclick="updateCart('${resId}', '${res.name}', '${mId}', '${m.dish.replace(/'/g, "\\'")}', ${price}, 1)" class="bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-xl font-black text-[10px] uppercase active:scale-95">Add +</button>
                  ` : `
                    <div class="flex items-center gap-2 bg-red-600 text-white px-2.5 py-1.5 rounded-xl">
                      <button onclick="updateCart('${resId}', '${res.name}', '${mId}', '${m.dish.replace(/'/g, "\\'")}', ${price}, -1)" class="font-black text-xs px-1">-</button>
                      <span class="font-black text-xs">${qty}</span>
                      <button onclick="updateCart('${resId}', '${res.name}', '${mId}', '${m.dish.replace(/'/g, "\\'")}', ${price}, 1)" class="font-black text-xs px-1">+</button>
                    </div>
                  `)}
                </div>
              </div>
            `;
          });
        } else {
          hotelHtml += '<p class="text-xs text-gray-400 text-center py-4">No menu items available yet.</p>';
        }

        hotelHtml += '</div>';
        resCard.innerHTML = hotelHtml;
        container.appendChild(resCard);
      });
    });

    // Cart Management
    window.updateCart = function(resId, resName, dishId, dishName, price, change) {
      if (!cart[dishId]) {
        if (change < 0) return;
        cart[dishId] = { name: dishName, price: price, qty: 0, restaurantId: resId, restaurantName: resName };
      }
      
      cart[dishId].qty += change;
      if (cart[dishId].qty <= 0) {
        delete cart[dishId];
      }
      
      updateCartUI();
    };

    function updateCartUI() {
      const cartBar = document.getElementById('cartBar');
      let totalItems = 0;
      let totalPrice = 0;

      Object.keys(cart).forEach(id => {
        totalItems += cart[id].qty;
        totalPrice += cart[id].price * cart[id].qty;
      });

      if (totalItems > 0) {
        cartBar.classList.remove('hidden');
        document.getElementById('cartItemCount').textContent = totalItems + ' Item' + (totalItems > 1 ? 's' : '') + ' Added';
        document.getElementById('cartTotalPrice').textContent = '₹' + totalPrice;
      } else {
        cartBar.classList.add('hidden');
      }

      // Re-render menu buttons to reflect new quantities
      // (Triggering a soft UI refresh via database state snapshot or simple DOM updates)
    }

    // Modal Controls
    window.openCheckoutModal = function() {
      let summaryHtml = '';
      let totalPrice = 0;
      Object.keys(cart).forEach(id => {
        let item = cart[id];
        let sub = item.price * item.qty;
        totalPrice += sub;
        summaryHtml += `<div class="flex justify-between"><span>${item.qty}x ${item.name} (${item.restaurantName})</span><span class="font-bold">₹${sub}</span></div>`;
      });
      summaryHtml += `<div class="border-t pt-2 mt-2 flex justify-between font-black text-gray-900 text-sm"><span>Total</span><span>₹${totalPrice}</span></div>`;
      
      document.getElementById('modalOrderSummary').innerHTML = summaryHtml;
      document.getElementById('checkoutModal').classList.remove('hidden');
    };

    window.closeCheckoutModal = function() {
      document.getElementById('checkoutModal').classList.add('hidden');
    };

    // WhatsApp Order Submission
    window.submitWhatsAppOrder = function() {
      const name = document.getElementById('custName').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const phone = document.getElementById('custPhone').value.trim();

      if (!name || !address || !phone) {
        alert('Please fill in all customer details (Name, Address, Phone)');
        return;
      }

      let message = `🛒 *NEW FOOD ORDER*%0A%0A`;
      message += `👤 *Name:* ${name}%0A`;
      message += `📍 *Address:* ${address}%0A`;
      message += `📞 *Phone:* ${phone}%0A%0A`;
      message += `*Items Ordered:*%0A`;

      let totalPrice = 0;
      Object.keys(cart).forEach(id => {
        let item = cart[id];
        let sub = item.price * item.qty;
        totalPrice += sub;
        message += `• ${item.qty}x ${item.name} [${item.restaurantName}] - ₹${sub}%0A`;
      });

      message += `%0A💰 *Total Amount: ₹${totalPrice}*%0A`;
      message += `Please confirm my order!`;

      // Replace with your business WhatsApp phone number (with country code, e.g., 919876543210)
      const adminWhatsAppNumber = "919876543210"; 
      const whatsappUrl = `https://wa.me/${adminWhatsAppNumber}?text=${message}`;

      window.open(whatsappUrl, '_blank');
    };
  </script>
</body>
</html>
