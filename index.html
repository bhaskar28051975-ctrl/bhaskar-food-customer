<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bhaskar Food</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html{scroll-behavior:smooth}
.dish-card{transition:transform 0.2s}
.dish-card:active{transform:scale(0.95)}
#trackMap{height:220px;width:100%;border-radius:16px;z-index:1}
.pulse-dot{width:14px;height:14px;background:#dc2626;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 0 rgba(220,38,38,0.4);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,0.4)}70%{box-shadow:0 0 0 12px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.radius-ring{stroke:#dc2626;stroke-width:2;fill:rgba(220,38,38,0.08)}
</style>
</head>
<body class="bg-gray-100 pb-80 text-gray-800">

<header class="bg-white p-5 shadow-sm sticky top-0 z-50 flex justify-between items-center border-b-4 border-red-600">
  <h1 class="text-xl font-black text-red-600 italic uppercase">Bhaskar Food</h1>
  <button onclick="location.reload()" class="text-[10px] font-bold bg-gray-100 px-3 py-1 rounded-full uppercase">Refresh</button>
</header>

<div id="customer-list" class="p-4 space-y-8"></div>

<!-- ══ CHECKOUT PANEL ══ -->
<div id="checkout-panel" class="hidden fixed bottom-0 left-0 right-0 bg-white rounded-t-[3rem] shadow-2xl p-6 border-t z-[100]">
  <div class="flex justify-between items-center mb-4 px-2">
    <div>
      <p class="text-[10px] font-black text-gray-400 uppercase">Total Bill</p>
      <p id="panel-total" class="text-3xl font-black text-green-600">₹0</p>
    </div>
    <button onclick="cancelOrder()" class="text-red-500 font-bold text-xs uppercase bg-red-50 px-4 py-2 rounded-full">Cancel</button>
  </div>

  <div class="space-y-3">
    <!-- Name -->
    <input id="custName" type="text" placeholder="Your Full Name *"
      class="w-full p-4 border rounded-2xl bg-gray-50 font-bold text-sm focus:outline-none focus:border-red-400"/>
    <!-- Phone -->
    <input id="custPhone" type="tel" placeholder="Your Phone Number *"
      class="w-full p-4 border rounded-2xl bg-gray-50 font-bold text-sm focus:outline-none focus:border-red-400"/>

    <!-- LOCATION SECTION -->
    <div class="bg-red-50 rounded-2xl p-4 border border-red-200 space-y-3">
      <div class="flex items-center justify-between">
        <div>
          <p class="font-black text-sm text-gray-800">📍 Live Location</p>
          <p class="text-xs text-gray-500 mt-0.5" id="locStatusText">Share your location for delivery tracking</p>
        </div>
        <button id="locBtn" onclick="requestLocation()"
          class="bg-red-600 text-white px-4 py-2 rounded-xl font-black text-xs uppercase active:scale-95 transition-transform">
          Share GPS
        </button>
      </div>

      <!-- Radius Display (set by Admin) -->
      <div class="bg-white rounded-xl p-3 border" id="radiusWrap">
        <div class="flex items-center justify-between">
          <p class="text-[11px] font-black text-gray-600 uppercase">📡 Service Area Radius</p>
          <span id="radiusVal" class="font-black text-red-600 text-sm">Loading…</span>
        </div>
        <div class="bg-gray-100 rounded-full h-2 mt-2">
          <div id="radiusBar" class="bg-red-500 h-2 rounded-full transition-all" style="width:20%"></div>
        </div>
        <p class="text-[10px] text-gray-400 mt-1.5 text-center">⚙️ Fixed by restaurant — cannot be changed</p>
      </div>

      <!-- MAP -->
      <div id="mapWrap" class="hidden space-y-2">
        <div id="trackMap"></div>
        <div class="flex items-center gap-2 bg-green-50 border border-green-200 rounded-xl px-3 py-2">
          <div class="pulse-dot flex-shrink-0"></div>
          <p class="text-xs font-bold text-green-700" id="locAddress">Getting address…</p>
        </div>
        <p class="text-[10px] text-gray-400 text-center">📡 Live location updates every 10 seconds</p>
      </div>
    </div>

    <button onclick="placeOrder()"
      class="w-full bg-red-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg active:scale-95 transition-transform text-base">
      🛵 Confirm Order
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const cfg = {
  apiKey:      "AIzaSyAT074ME7aIbb4R2VzgZZGdw8F3alL-xbA",
  authDomain:  "bhaskar-food-app.firebaseapp.com",
  databaseURL: "https://bhaskar-food-app-default-rtdb.firebaseio.com",
  projectId:   "bhaskar-food-app",
  appId:       "1:712053690568:web:b4d8b789e0359ebc0e95fd"
};
const db = getDatabase(initializeApp(cfg));

/* ── state ── */
let cart        = {};
let resData     = {};
let myLat       = null;
let myLng       = null;
let myAddress   = '';
let watchId     = null;
let trackMap    = null;
let myMarker    = null;
let myCircle    = null;
let radiusM     = 200;   // loaded from Firebase — set by admin
const MIN_R     = 50;
const MAX_R     = 1000;
let orderLat    = null;
let orderLng    = null;
let wasOutside  = false;
let activeOid   = null;
let speechReady = false;

/* ── VOICE ALERT ENGINE ── */
function speak(text, urgent = false){
  if(!window.speechSynthesis) return;
  // cancel any current speech
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang   = 'en-IN';   // Indian English accent
  utter.rate   = urgent ? 0.85 : 0.95;
  utter.pitch  = urgent ? 1.2 : 1.0;
  utter.volume = 1.0;
  // pick a voice if available
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en'));
  if(enVoice) utter.voice = enVoice;
  window.speechSynthesis.speak(utter);
}

// Preload voices on user gesture (required by mobile browsers)
function initSpeech(){
  if(speechReady) return;
  speechReady = true;
  window.speechSynthesis.getVoices();
  // silent warm-up
  const warm = new SpeechSynthesisUtterance(' ');
  warm.volume = 0;
  window.speechSynthesis.speak(warm);
}
document.addEventListener('click', initSpeech, { once: true });

/* ── LOAD SERVICE RADIUS FROM FIREBASE (admin controlled) ── */
onValue(ref(db,'settings/serviceRadius'), snap => {
  const val = parseInt(snap.val()) || 200;
  radiusM = val;
  document.getElementById('radiusVal').textContent = val + ' m';
  const pct = ((val - MIN_R) / (MAX_R - MIN_R)) * 100;
  document.getElementById('radiusBar').style.width = pct + '%';
  if(myCircle) myCircle.setRadius(val);
});

/* ── LOCATION ── */
window.requestLocation = () => {
  const btn = document.getElementById('locBtn');
  if(!navigator.geolocation){ alert('GPS not supported on this device.'); return; }
  btn.textContent = '⏳ Getting…';
  btn.disabled    = true;

  navigator.geolocation.getCurrentPosition(pos => {
    myLat = pos.coords.latitude;
    myLng = pos.coords.longitude;
    btn.textContent = '✅ Sharing';
    btn.classList.replace('bg-red-600','bg-green-600');
    document.getElementById('locStatusText').textContent = '✅ Live location sharing ON';
    showMap();
    reverseGeocode(myLat, myLng);

    // watch position — update every ~10 sec
    if(watchId) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(p => {
      myLat = p.coords.latitude;
      myLng = p.coords.longitude;
      updateMapPin(myLat, myLng);
      reverseGeocode(myLat, myLng);
      // check if customer crossed radius from order origin
      checkRadiusBreach(myLat, myLng);
      // push live location to Firebase if order active
      if(activeOid){
        set(ref(db,`orders/${activeOid}/lat`), myLat);
        set(ref(db,`orders/${activeOid}/lng`), myLng);
      }
    }, null, { enableHighAccuracy: true, maximumAge: 8000 });

  }, err => {
    btn.textContent = 'Share GPS';
    btn.disabled    = false;
    alert('Location permission denied. Please allow GPS in browser settings.');
  }, { enableHighAccuracy: true });
};

function showMap(){
  document.getElementById('mapWrap').classList.remove('hidden');
  if(!trackMap){
    trackMap = L.map('trackMap',{ zoomControl:true, attributionControl:false }).setView([myLat, myLng], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(trackMap);
  }
  updateMapPin(myLat, myLng);
  setTimeout(()=>trackMap.invalidateSize(), 200);
}

function updateMapPin(lat, lng){
  if(!trackMap) return;
  const icon = L.divIcon({
    html: '<div class="pulse-dot"></div>',
    iconSize: [14,14], className: ''
  });
  if(myMarker) myMarker.setLatLng([lat, lng]);
  else myMarker = L.marker([lat, lng],{icon}).addTo(trackMap).bindPopup('📍 You are here');
  if(myCircle) myCircle.setLatLng([lat, lng]).setRadius(radiusM);
  else myCircle = L.circle([lat, lng],{
    radius: radiusM, color:'#dc2626', fillColor:'#dc2626', fillOpacity:0.1, weight:2
  }).addTo(trackMap);
  trackMap.setView([lat, lng], 16);
}

function reverseGeocode(lat, lng){
  fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
    .then(r=>r.json()).then(d=>{
      const a = d.address||{};
      myAddress = [a.road||a.suburb||'',a.city||a.town||a.village||'',a.state||'']
        .filter(Boolean).join(', ');
      document.getElementById('locAddress').textContent = '📍 ' + (myAddress || `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    }).catch(()=>{
      myAddress = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      document.getElementById('locAddress').textContent = '📍 ' + myAddress;
    });
}

/* ── HAVERSINE DISTANCE (metres) ── */
function getDistance(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

/* ── RADIUS BREACH CHECK & VOICE ALERT ── */
function checkRadiusBreach(lat, lng){
  if(!orderLat || !orderLng) return;   // no origin set yet
  const dist    = getDistance(lat, lng, orderLat, orderLng);
  const outside = dist > radiusM;
  const bar     = document.getElementById('locStatusText');

  if(outside && !wasOutside){
    // just crossed OUTSIDE
    wasOutside = true;
    speak('Warning! You are crossing the service area. Please stay within the delivery zone.', true);
    if(bar) bar.textContent = `⚠️ Outside radius! (${dist}m away)`;
    if(bar) bar.classList.add('text-red-600');
    // flash alert banner
    showAlert('⚠️ You are crossing the service area!', 'red');
  } else if(!outside && wasOutside){
    // came back INSIDE
    wasOutside = false;
    speak('You are back in the service area. Thank you!');
    if(bar) bar.textContent = `✅ Inside radius (${dist}m from start)`;
    if(bar) bar.classList.remove('text-red-600');
    showAlert('✅ You are back in the service area!', 'green');
  } else if(outside){
    // still outside — update distance
    if(bar) bar.textContent = `⚠️ Outside radius! (${dist}m away)`;
  } else {
    if(bar) bar.textContent = `✅ Live location sharing ON (${dist}m from start)`;
  }
}

/* ── ALERT BANNER ── */
function showAlert(msg, color){
  let banner = document.getElementById('alertBanner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'alertBanner';
    banner.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 20px;border-radius:14px;font-weight:800;font-size:13px;text-align:center;white-space:nowrap;max-width:90vw;transition:opacity 0.4s;box-shadow:0 4px 20px rgba(0,0,0,0.2)';
    document.body.appendChild(banner);
  }
  banner.textContent  = msg;
  banner.style.background = color==='red' ? '#dc2626' : '#16a34a';
  banner.style.color  = '#fff';
  banner.style.opacity = '1';
  clearTimeout(banner._t);
  banner._t = setTimeout(()=>{ banner.style.opacity='0'; }, 4000);
}

/* ── CART ── */
window.updateQty = (id, dish, price, change) => {
  if(!cart[id]) cart[id] = { dish, price: parseInt(price), qty: 0 };
  cart[id].qty += change;
  if(cart[id].qty <= 0) delete cart[id];
  updateUI(); renderMenu();
};
window.cancelOrder = () => {
  cart = {};
  if(watchId){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  updateUI(); renderMenu();
};

function updateUI(){
  const total = Object.values(cart).reduce((s,i)=>s+(i.price*i.qty),0);
  document.getElementById('checkout-panel').style.display = total>0 ? 'block' : 'none';
  document.getElementById('panel-total').innerText = '₹'+total;
}

/* ── RENDER MENU ── */
function renderMenu(){
  const container = document.getElementById('customer-list');
  container.innerHTML = '';
  Object.keys(resData).forEach(resId => {
    const res = resData[resId];
    let menuHtml = '';
    if(res.menu){
      Object.keys(res.menu).forEach(mId => {
        const m   = res.menu[mId];
        const qty = cart[mId] ? cart[mId].qty : 0;
        menuHtml += `
        <div class="dish-card bg-white rounded-2xl p-2 border flex flex-col items-center shadow-sm">
          <img src="${m.dishImg}"
               onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'"
               class="w-full aspect-square rounded-xl object-cover mb-2"/>
          <p class="font-bold text-[11px] h-8 text-center line-clamp-2">${m.dish}</p>
          <p class="text-red-600 font-black text-xs mb-2">₹${m.price}</p>
          <div class="w-full flex items-center justify-between gap-1">
            ${qty > 0 ? `
            <button onclick="updateQty('${mId}','${m.dish}','${m.price}',-1)"
              class="w-8 h-8 bg-red-100 text-red-600 rounded-lg font-black text-lg flex items-center justify-center">−</button>
            <span class="font-black text-sm text-gray-800">${qty}</span>
            <button onclick="updateQty('${mId}','${m.dish}','${m.price}',1)"
              class="w-8 h-8 bg-red-500 text-white rounded-lg font-black text-lg flex items-center justify-center">+</button>
            ` : `
            <button onclick="updateQty('${mId}','${m.dish}','${m.price}',1)"
              class="w-full bg-red-500 text-white py-1.5 rounded-lg text-[10px] font-bold uppercase">Add +</button>
            `}
          </div>
        </div>`;
      });
    }
    container.innerHTML += `
    <div class="bg-white rounded-[3rem] shadow-sm border overflow-hidden">
      <img src="${res.image}" class="w-full h-44 object-cover"/>
      <div class="p-6">
        <h2 class="text-xl font-black text-gray-800 uppercase italic mb-6 border-l-4 border-red-500 pl-3">${res.name}</h2>
        <div class="grid grid-cols-2 gap-4">${menuHtml}</div>
      </div>
    </div>`;
  });
}

onValue(ref(db,'restaurants'), snap => { resData = snap.val()||{}; renderMenu(); });

/* ── PLACE ORDER ── */
window.placeOrder = async () => {
  const name  = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();

  if(!name)  { alert('⚠️ Please enter your name!'); return; }
  if(!phone) { alert('⚠️ Please enter your phone number!'); return; }
  if(phone.length < 10){ alert('⚠️ Please enter a valid 10-digit phone number!'); return; }
  if(!myLat) { alert('⚠️ Please share your live location first!'); return; }

  // save order origin for radius breach detection
  orderLat = myLat;
  orderLng = myLng;
  wasOutside = false;

  const items = Object.values(cart).map(i=>`${i.dish} x${i.qty}`).join(', ');
  const total = Object.values(cart).reduce((s,i)=>s+(i.price*i.qty),0);
  const oid   = push(ref(db,'orders')).key;

  await set(ref(db,'orders/'+oid), {
    id:           oid,
    customerName: name,
    customerPhone:phone,
    items,
    totalAmount:  total,
    status:       'pending',
    lat:          myLat,
    lng:          myLng,
    address:      myAddress,
    radiusMeters: radiusM,
    timestamp:    Date.now()
  });

  activeOid = oid;

  // Keep location updating in Firebase while order is active
  if(watchId){
    navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(p => {
      myLat = p.coords.latitude;
      myLng = p.coords.longitude;
      set(ref(db,`orders/${oid}/lat`), p.coords.latitude);
      set(ref(db,`orders/${oid}/lng`), p.coords.longitude);
      checkRadiusBreach(p.coords.latitude, p.coords.longitude);
    }, null, { enableHighAccuracy:true, maximumAge:8000 });
  }

  speak('Order placed successfully! Your delivery is on the way.');
  showAlert(`✅ Order placed! Total: ₹${total}`, 'green');
  cart = {};
  updateUI();
  renderMenu();
};
</script>
</body>
</html>
