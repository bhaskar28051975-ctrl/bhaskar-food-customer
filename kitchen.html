<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kitchen – Bhaskar Food</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body class="bg-orange-50 pb-24 p-4">
<div class="max-w-md mx-auto space-y-4">

  <h1 class="text-2xl font-black text-orange-600 italic uppercase">👨‍🍳 Kitchen Live</h1>

  <div id="live-orders" class="space-y-4">
    <div class="flex items-center justify-center py-12">
      <div class="w-8 h-8 border-4 border-orange-400 border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <hr class="border-orange-200"/>
  <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest">Last 10 Completed</h2>
  <div id="order-history" class="space-y-2 opacity-60"></div>
</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-4 z-50">
  <a href="control.html" class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-grid-2 text-xl"></i><span class="text-[9px] font-bold">Control</span></a>
  <a href="admin.html"   class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-gears text-xl"></i><span class="text-[9px] font-bold">Admin</span></a>
  <a href="kitchen.html" class="flex flex-col items-center gap-1 text-orange-600"><i class="fa-solid fa-utensils text-xl"></i><span class="text-[9px] font-bold">Kitchen</span></a>
  <a href="delivery.html" class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-truck text-xl"></i><span class="text-[9px] font-bold">Delivery</span></a>
  <a href="reports.html"  class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-chart-pie text-xl"></i><span class="text-[9px] font-bold">Reports</span></a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// Firebase compat SDK - simpler, more reliable
firebase.initializeApp({
  apiKey: "AIzaSyAT074ME7aIbb4R2VzgZZGdw8F3alL-xbA",
  authDomain: "bhaskar-food-app.firebaseapp.com",
  databaseURL: "https://bhaskar-food-app-default-rtdb.firebaseio.com",
  projectId: "bhaskar-food-app",
  appId: "1:712053690568:web:b4d8b789e0359ebc0e95fd"
});

const db = firebase.database();

function updateStatus(id, newStatus) {
  db.ref('orders/' + id).update({ status: newStatus });
}

db.ref('orders').on('value', function(snap) {
  var liveDiv = document.getElementById('live-orders');
  var histDiv = document.getElementById('order-history');
  liveDiv.innerHTML = '';
  histDiv.innerHTML = '';

  if (!snap.exists()) {
    liveDiv.innerHTML = '<div class="text-center py-12 text-gray-400"><div class="text-5xl">🍽️</div><p class="font-black mt-3 uppercase">No orders yet</p></div>';
    histDiv.innerHTML = '<p class="text-center text-xs text-gray-400 py-2">No history yet.</p>';
    return;
  }

  var all = [];
  snap.forEach(function(child) {
    var o = child.val();
    o.id = child.key;
    all.push(o);
  });
  all.reverse();

  var liveCount = 0;
  var histCount = 0;

  all.forEach(function(o) {
    var status = o.status || 'pending';
    var name   = o.customerName || '—';
    var phone  = o.customerPhone || '—';
    var items  = o.items || '—';
    var total  = o.totalAmount || 0;
    var id     = o.id;

    if (status === 'pending' || status === 'preparing' || status === 'ready_for_pickup' || status === 'out_for_delivery' || status === 'cancelled') {
      liveCount++;

      var borderCol = 'border-red-500';
      var bgCol     = 'bg-red-50';
      var label     = '🔴 New Order';

      if (status === 'preparing')        { borderCol = 'border-orange-400'; bgCol = 'bg-orange-50'; label = '🟡 Preparing'; }
      if (status === 'ready_for_pickup') { borderCol = 'border-green-500';  bgCol = 'bg-green-50';  label = '🟢 Ready for Pickup'; }
      if (status === 'out_for_delivery') { borderCol = 'border-blue-400';   bgCol = 'bg-blue-50';   label = '🚚 Out for Delivery'; }
      if (status === 'cancelled')        { borderCol = 'border-gray-400';   bgCol = 'bg-gray-50';   label = '❌ Cancelled'; }

      var itemRows = items.split(',').map(function(i) {
        return '<p class="text-sm font-bold text-gray-700 border-b border-gray-100 py-1 last:border-0">• ' + i.trim() + '</p>';
      }).join('');

      var buttons = '';
      if (status !== 'cancelled' && status !== 'out_for_delivery') {
        buttons = '<div class="grid grid-cols-3 gap-2 mt-3">' +
          '<button onclick="updateStatus(\'' + id + '\',\'preparing\')" class="bg-orange-500 text-white py-3 rounded-xl font-black uppercase text-[11px] active:scale-95">🍳 Preparing</button>' +
          '<button onclick="updateStatus(\'' + id + '\',\'ready_for_pickup\')" class="bg-green-600 text-white py-3 rounded-xl font-black uppercase text-[11px] active:scale-95">✅ Ready</button>' +
          '<button onclick="if(confirm(\'Cancel?\'))updateStatus(\'' + id + '\',\'cancelled\')" class="bg-red-100 text-red-600 border-2 border-red-300 py-3 rounded-xl font-black text-[11px] active:scale-95">❌ Cancel</button>' +
          '</div>';
      }

      var div = document.createElement('div');
      div.className = 'bg-white rounded-3xl border-2 ' + borderCol + ' shadow-md p-5 space-y-3';
      div.innerHTML =
        '<div class="flex justify-between items-start">' +
          '<div>' +
            '<span class="text-[10px] font-black uppercase px-3 py-1.5 rounded-full ' + bgCol + ' border ' + borderCol + '">' + label + '</span>' +
            '<p class="font-black text-gray-800 text-lg mt-2">' + name + '</p>' +
            '<a href="tel:' + phone + '" class="text-blue-600 font-bold text-sm">📞 ' + phone + '</a>' +
          '</div>' +
          '<div class="text-right">' +
            '<p class="font-black text-2xl text-green-600">₹' + total + '</p>' +
            '<p class="text-[10px] font-bold text-orange-500 mt-1">💵 Cash on Delivery</p>' +
          '</div>' +
        '</div>' +
        '<div class="bg-gray-50 rounded-2xl p-3 border">' +
          '<p class="text-[10px] font-black text-gray-400 uppercase mb-2">🍽️ Order Items</p>' +
          itemRows +
        '</div>' +
        buttons;

      liveDiv.appendChild(div);

    } else if ((status === 'completed' || status === 'settled') && histCount < 10) {
      histCount++;
      histDiv.innerHTML +=
        '<div class="bg-white p-3 rounded-xl border flex justify-between items-start text-xs font-bold">' +
          '<div><p class="text-gray-700">' + name + '</p>' +
          '<p class="text-gray-400 mt-0.5 max-w-[200px] truncate">' + items + '</p></div>' +
          '<span class="text-green-600 font-black ml-2 shrink-0">✅ ₹' + total + '</span>' +
        '</div>';
    }
  });

  if (liveCount === 0) {
    liveDiv.innerHTML = '<div class="text-center py-12"><div class="text-5xl">🍽️</div><p class="font-black text-gray-400 mt-3 uppercase">No active orders</p><p class="text-xs text-gray-400 mt-1">New orders appear here instantly</p></div>';
  }
  if (histCount === 0) {
    histDiv.innerHTML = '<p class="text-center text-gray-400 text-xs py-2">No completed orders yet.</p>';
  }

}, function(error) {
  document.getElementById('live-orders').innerHTML =
    '<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center space-y-3">' +
    '<p class="font-black text-red-600 text-lg">❌ Connection Error</p>' +
    '<p class="text-xs text-red-500">' + error.message + '</p>' +
    '<button onclick="location.reload()" class="bg-red-600 text-white px-6 py-3 rounded-xl font-black text-xs uppercase">🔄 Retry</button>' +
    '</div>';
});
</script>
</body>
</html>
