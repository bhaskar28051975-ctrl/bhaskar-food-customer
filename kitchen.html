<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kitchen Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body class="bg-orange-50 pb-24 p-4">
<div class="max-w-md mx-auto space-y-5">

  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-black text-orange-600 italic uppercase">👨‍🍳 Kitchen Live</h1>
    <span id="liveCount" class="bg-orange-100 text-orange-600 font-black text-xs px-3 py-1.5 rounded-full border border-orange-200">0 Active</span>
  </div>

  <!-- LIVE ORDERS -->
  <div id="live-orders" class="space-y-4">
    <div class="flex items-center justify-center py-12">
      <div class="w-8 h-8 border-4 border-orange-400 border-t-transparent rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- CANCELLED ORDERS -->
  <div id="cancelled-section" class="hidden space-y-3">
    <p class="text-[10px] font-black text-red-400 uppercase tracking-widest">❌ Cancelled Orders</p>
    <div id="cancelled-orders" class="space-y-2"></div>
  </div>

  <hr class="border-orange-200"/>
  <h2 class="text-xs font-black text-gray-400 uppercase tracking-widest">📋 Last 10 Orders History</h2>
  <div id="order-history" class="space-y-2 opacity-60"></div>
</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-4 z-[100]">
  <a href="admin.html" class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-gears text-xl"></i><span class="text-[9px] font-bold">Admin</span></a>
  <a href="kitchen.html" class="flex flex-col items-center gap-1 text-orange-600"><i class="fa-solid fa-utensils text-xl"></i><span class="text-[9px] font-bold">Kitchen</span></a>
  <a href="delivery.html" class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-truck text-xl"></i><span class="text-[9px] font-bold">Delivery</span></a>
  <a href="reports.html" class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-chart-pie text-xl"></i><span class="text-[9px] font-bold">Reports</span></a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const db = getDatabase(initializeApp({
  apiKey:"AIzaSyAT074ME7aIbb4R2VzgZZGdw8F3alL-xbA",
  authDomain:"bhaskar-food-app.firebaseapp.com",
  databaseURL:"https://bhaskar-food-app-default-rtdb.firebaseio.com",
  projectId:"bhaskar-food-app",
  appId:"1:712053690568:web:b4d8b789e0359ebc0e95fd"
}));

window.updateStatus=(id,s)=>update(ref(db,`orders/${id}`),{status:s});

function timeAgo(ts){
  if(!ts) return '';
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return 'just now';if(m<60) return m+'m ago';
  return Math.floor(m/60)+'h '+m%60+'m ago';
}

onValue(ref(db,'orders'),snap=>{
  const live=document.getElementById('live-orders');
  const cancelled=document.getElementById('cancelled-orders');
  const cancelSection=document.getElementById('cancelled-section');
  const hist=document.getElementById('order-history');
  live.innerHTML=''; cancelled.innerHTML=''; hist.innerHTML='';

  let all=[],activeCount=0,cancelCount=0;
  snap.forEach(c=>all.push({id:c.key,...c.val()}));
  all.reverse();

  all.forEach(order=>{
    const statusColor={
      pending:'border-red-400 bg-red-50',
      preparing:'border-orange-400 bg-orange-50',
      ready_for_pickup:'border-green-400 bg-green-50',
      cancelled:'border-gray-300 bg-gray-50',
      completed:'border-green-300 bg-green-50'
    }[order.status]||'border-gray-300 bg-white';

    if(order.status==='pending'||order.status==='preparing'||order.status==='ready_for_pickup'){
      activeCount++;
      const urgency=order.status==='pending'?'🔴':'order.status==="preparing"'?'🟡':'🟢';
      live.innerHTML+=`<div class="bg-white rounded-3xl border-2 ${statusColor} p-5 space-y-3 shadow-sm">
        <div class="flex justify-between items-start">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-lg">${order.status==='pending'?'🔴':order.status==='preparing'?'🟡':'🟢'}</span>
              <span class="font-black text-xs uppercase text-gray-500">${order.status.replace('_',' ')}</span>
            </div>
            <p class="font-black text-gray-800">${order.customerName||'—'}</p>
            <p class="text-blue-600 text-xs font-bold">📞 ${order.customerPhone||'—'}</p>
          </div>
          <div class="text-right">
            <p class="font-black text-green-600 text-lg">₹${order.totalAmount||0}</p>
            <p class="text-[10px] text-gray-400 font-bold">${timeAgo(order.timestamp)}</p>
            <p class="text-[10px] text-orange-500 font-black uppercase">💵 COD</p>
          </div>
        </div>
        <div class="bg-gray-50 rounded-2xl p-3 border">
          <p class="text-[10px] font-black text-gray-400 uppercase mb-1.5">🍽️ Order Items</p>
          ${(order.items||'').split(',').map(i=>`<p class="text-sm font-bold text-gray-700 py-0.5 border-b border-gray-100 last:border-0">• ${i.trim()}</p>`).join('')}
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="updateStatus('${order.id}','preparing')" class="bg-orange-500 text-white py-3 rounded-xl font-black uppercase text-[10px] active:scale-95">🍳 Preparing</button>
          <button onclick="updateStatus('${order.id}','ready_for_pickup')" class="bg-green-600 text-white py-3 rounded-xl font-black uppercase text-[10px] active:scale-95">✅ Ready</button>
          <button onclick="if(confirm('Cancel this order?')) updateStatus('${order.id}','cancelled')" class="bg-red-100 text-red-600 border border-red-200 py-3 rounded-xl font-black text-[10px] active:scale-95">❌ Cancel</button>
        </div>
      </div>`;
    } else if(order.status==='cancelled'){
      cancelCount++;
      cancelled.innerHTML+=`<div class="bg-red-50 border border-red-200 rounded-2xl p-4 flex items-center gap-3">
        <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center text-lg flex-shrink-0">❌</div>
        <div class="flex-1 min-w-0">
          <p class="font-black text-sm text-gray-700">${order.customerName||'—'}</p>
          <p class="text-[10px] text-gray-500 truncate">${order.items||'—'}</p>
          <p class="text-[10px] text-red-500 font-bold mt-0.5">
            Cancelled ${order.cancelledBy==='customer'?'by customer':'by kitchen'} · ${timeAgo(order.cancelledAt||order.timestamp)}
          </p>
        </div>
        <p class="font-black text-red-500 text-sm shrink-0">₹${order.totalAmount||0}</p>
      </div>`;
    } else if(order.status==='completed'||order.status==='settled'){
      hist.innerHTML+=`<div class="bg-white p-3 rounded-xl border flex justify-between text-[10px] font-bold">
        <div class="min-w-0 flex-1"><p class="truncate">${order.items||'—'}</p><p class="text-gray-400 mt-0.5">${order.customerName||'—'} · ${timeAgo(order.timestamp)}</p></div>
        <span class="text-green-600 font-black ml-2 shrink-0">✅ ₹${order.totalAmount||0}</span>
      </div>`;
    }
  });

  document.getElementById('liveCount').textContent=activeCount+' Active';
  if(cancelCount>0) cancelSection.classList.remove('hidden'); else cancelSection.classList.add('hidden');
  if(!live.innerHTML) live.innerHTML='<div class="text-center py-12"><div class="text-5xl mb-3">🍽️</div><p class="font-black text-gray-400">No active orders right now</p></div>';
  if(!hist.innerHTML) hist.innerHTML='<p class="text-center text-gray-400 text-sm py-4">No history yet.</p>';
});
</script>
</body>
</html>
