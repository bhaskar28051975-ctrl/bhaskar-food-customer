<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Admin Dashboard – Bhaskar Food</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
<style>
.sheet{animation:su .3s ease}
@keyframes su{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.ov{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
#mainApp{display:block}
</style>
</head>
<body class="bg-gray-50 pb-28">

<!-- LOADING / AUTH -->
<div id="loadingScreen" class="fixed inset-0 bg-blue-600 z-[300] flex flex-col items-center justify-center">
  <div class="text-6xl mb-4">⚙️</div>
  <p class="text-white font-black text-xl uppercase">Bhaskar Food</p>
  <p class="text-blue-200 text-sm mt-2">Admin Control Panel</p>
  <div class="mt-6 flex gap-2">
    <div class="w-2 h-2 bg-white rounded-full animate-bounce" style="animation-delay:0s"></div>
    <div class="w-2 h-2 bg-white rounded-full animate-bounce" style="animation-delay:.15s"></div>
    <div class="w-2 h-2 bg-white rounded-full animate-bounce" style="animation-delay:.3s"></div>
  </div>
</div>

<!-- TOP HEADER -->
<div class="bg-blue-600 text-white p-6 shadow-xl rounded-b-[2.5rem]">
  <div class="max-w-md mx-auto flex justify-between items-center">
    <div>
      <p class="text-[10px] font-black uppercase opacity-70 tracking-widest">Management Hub</p>
      <h1 class="text-2xl font-black italic mt-0.5">Admin Dashboard</h1>
    </div>
    <button id="refreshBtn" class="bg-white/20 p-3 rounded-2xl active:scale-90" title="Refresh">
      <i class="fa-solid fa-rotate text-lg"></i>
    </button>
  </div>
</div>

<!-- MAIN CONTENT CONTAINER -->
<div class="max-w-md mx-auto p-4 space-y-6">

  <!-- STATS OVERVIEW -->
  <div class="grid grid-cols-2 gap-3">
    <div class="bg-white p-4 rounded-2xl border shadow-sm">
      <p class="text-[10px] font-black text-gray-400 uppercase">Total Orders</p>
      <p id="statTotalOrders" class="text-2xl font-black text-gray-800 mt-1">0</p>
    </div>
    <div class="bg-white p-4 rounded-2xl border shadow-sm">
      <p class="text-[10px] font-black text-gray-400 uppercase">Total Revenue</p>
      <p id="statTotalRevenue" class="text-2xl font-black text-green-600 mt-1">₹0</p>
    </div>
  </div>

  <!-- SECTION: MANAGE DELIVERY PARTNERS -->
  <div class="bg-white rounded-[2rem] border shadow-sm p-5 space-y-4">
    <div class="flex justify-between items-center">
      <h2 class="font-black text-gray-800 text-sm uppercase">🛵 Delivery Partners</h2>
      <button id="openAddBoyModal" class="bg-blue-50 text-blue-600 px-3 py-1.5 rounded-xl font-black text-xs uppercase active:scale-95">+ Add Partner</button>
    </div>
    <div id="deliveryPartnersList" class="space-y-2">
      <p class="text-center text-gray-400 text-xs py-3">Loading partners...</p>
    </div>
  </div>

  <!-- SECTION: LIVE ORDERS & ASSIGNMENTS -->
  <div class="space-y-3">
    <div class="flex justify-between items-center ml-1">
      <h2 class="font-black text-gray-700 text-xs uppercase tracking-widest">📦 Incoming & Active Orders</h2>
      <span id="activeOrdersCount" class="text-[10px] bg-blue-100 text-blue-600 font-black px-2 py-0.5 rounded-full">0 Active</span>
    </div>
    <div id="adminOrdersList" class="space-y-4">
      <p class="text-center text-gray-400 text-sm py-6">No orders found.</p>
    </div>
  </div>

</div>

<!-- ADD/EDIT DELIVERY BOY MODAL -->
<div id="boyModal" class="ov fixed inset-0 z-[150] hidden flex items-center justify-center p-4">
  <div class="sheet bg-white w-full max-w-sm rounded-[2rem] p-6 space-y-4">
    <div class="flex justify-between items-center">
      <h3 class="font-black text-gray-800 text-sm uppercase" id="boyModalTitle">Add Delivery Partner</h3>
      <button id="closeBoyModal" class="text-gray-400 text-xl leading-none">✕</button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase">Username (Login ID) *</label>
        <input id="boyUsername" type="text" placeholder="e.g. rahul" class="w-full p-3 border-2 rounded-xl bg-gray-50 font-bold text-sm mt-1 focus:outline-none focus:border-blue-500"/>
      </div>
      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase">Password *</label>
        <input id="boyPassword" type="text" placeholder="e.g. pass123" class="w-full p-3 border-2 rounded-xl bg-gray-50 font-bold text-sm mt-1 focus:outline-none focus:border-blue-500"/>
      </div>
      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase">Full Name *</label>
        <input id="boyName" type="text" placeholder="e.g. Rahul Sharma" class="w-full p-3 border-2 rounded-xl bg-gray-50 font-bold text-sm mt-1 focus:outline-none focus:border-blue-500"/>
      </div>
      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase">Phone Number</label>
        <input id="boyPhone" type="tel" placeholder="e.g. 9876543210" class="w-full p-3 border-2 rounded-xl bg-gray-50 font-bold text-sm mt-1 focus:outline-none focus:border-blue-500"/>
      </div>
      <button id="saveBoyBtn" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-black text-sm uppercase shadow-md active:scale-95 mt-2">💾 Save Partner Account</button>
    </div>
  </div>
</div>

<!-- BANNER NOTIFICATION -->
<div id="adminBanner" class="fixed top-20 left-1/2 -translate-x-1/2 z-[9999] px-5 py-3 rounded-2xl font-black text-sm text-white text-center max-w-xs w-[90vw] shadow-xl opacity-0 pointer-events-none transition-opacity duration-300"></div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-4 z-[100]">
  <a href="control.html"  class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-grid-2 text-xl"></i><span class="text-[9px] font-bold">Control</span></a>
  <a href="admin.html"    class="flex flex-col items-center gap-1 text-blue-600"><i class="fa-solid fa-gears text-xl"></i><span class="text-[9px] font-bold">Admin</span></a>
  <a href="kitchen.html"  class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-utensils text-xl"></i><span class="text-[9px] font-bold">Kitchen</span></a>
  <a href="delivery.html" class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-truck text-xl"></i><span class="text-[9px] font-bold">Delivery</span></a>
  <a href="reports.html"  class="flex flex-col items-center gap-1 text-gray-400"><i class="fa-solid fa-chart-pie text-xl"></i><span class="text-[9px] font-bold">Reports</span></a>
</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAT074ME7aIbb4R2VzgZZGdw8F3alL-xbA",
  authDomain: "bhaskar-food-app.firebaseapp.com",
  databaseURL: "https://bhaskar-food-app-default-rtdb.firebaseio.com",
  projectId: "bhaskar-food-app",
  appId: "1:712053690568:web:b4d8b789e0359ebc0e95fd"
});
var db = firebase.database();
var activeDeliveryPartners = {};

function showBanner(msg, color){
  var b = document.getElementById('adminBanner');
  b.textContent = msg;
  b.style.background = color === 'red' ? '#dc2626' : color === 'green' ? '#16a34a' : '#2563eb';
  b.style.opacity = '1'; clearTimeout(b._t); b._t = setTimeout(function(){b.style.opacity = '0';}, 4000);
}

// Hide loading screen initially after brief check
setTimeout(function(){
  document.getElementById('loadingScreen').style.display = 'none';
}, 600);

document.getElementById('refreshBtn').addEventListener('click', function(){
  showBanner('🔄 Dashboard Refreshed', 'blue');
  initAdminData();
});

// Delivery Partner Modal toggles
document.getElementById('openAddBoyModal').addEventListener('click', function(){
  document.getElementById('boyModalTitle').textContent = 'Add Delivery Partner';
  document.getElementById('boyUsername').value = '';
  document.getElementById('boyUsername').disabled = false;
  document.getElementById('boyPassword').value = '';
  document.getElementById('boyName').value = '';
  document.getElementById('boyPhone').value = '';
  document.getElementById('boyModal').classList.remove('hidden');
});

document.getElementById('closeBoyModal').addEventListener('click', function(){
  document.getElementById('boyModal').classList.add('hidden');
});

// Save / Create Delivery Partner Account
document.getElementById('saveBoyBtn').addEventListener('click', function(){
  var u = document.getElementById('boyUsername').value.trim().toLowerCase();
  var p = document.getElementById('boyPassword').value.trim();
  var name = document.getElementById('boyName').value.trim();
  var phone = document.getElementById('boyPhone').value.trim();
  
  if(!u || !p || !name){
    alert('Please fill username, password, and name.');
    return;
  }
  
  db.ref('deliveryAccounts/' + u).set({
    username: u,
    password: p,
    name: name,
    phone: phone,
    active: true,
    createdAt: Date.now()
  }, function(err){
    if(err){
      showBanner('❌ Failed to save partner', 'red');
    } else {
      showBanner('✅ Delivery partner saved successfully!', 'green');
      document.getElementById('boyModal').classList.add('hidden');
      initAdminData();
    }
  });
});

function initAdminData(){
  // Fetch Delivery Partners
  db.ref('deliveryAccounts').on('value', function(snap){
    var listEl = document.getElementById('deliveryPartnersList');
    listEl.innerHTML = '';
    activeDeliveryPartners = {};
    
    if(!snap.exists()){
      listEl.innerHTML = '<p class="text-center text-gray-400 text-xs py-3">No delivery partners registered yet.</p>';
      return;
    }
    
    snap.forEach(function(child){
      var boy = child.val();
      var key = child.key;
      if(boy.active !== false) {
        activeDeliveryPartners[key] = boy.name || key;
      }
      
      var dDiv = document.createElement('div');
      dDiv.className = 'flex items-center justify-between bg-gray-50 p-3 rounded-xl border text-xs';
      dDiv.innerHTML = 
        '<div>' +
          '<p class="font-black text-gray-800">' + (boy.name || key) + ' <span class="text-[10px] text-gray-400 font-normal">(@' + key + ')</span></p>' +
          '<p class="text-blue-600 font-bold mt-0.5">📞 ' + (boy.phone || 'No phone') + '</p>' +
        '</div>' +
        '<div class="flex items-center gap-2">' +
          '<button onclick="toggleBoyStatus(\'' + key + '\', ' + (boy.active !== false) + ')" class="px-2.5 py-1 rounded-lg font-black ' + (boy.active !== false ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700') + '">' + (boy.active !== false ? 'Active' : 'Disabled') + '</button>' +
          '<button onclick="deleteBoy(\'' + key + '\')" class="text-gray-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>' +
        '</div>';
      listEl.appendChild(dDiv);
    });
    
    // Refresh orders list to update dropdown options with latest partners list
    loadAdminOrders();
  });
}

function toggleBoyStatus(username, currentStatus){
  db.ref('deliveryAccounts/' + username).update({ active: !currentStatus });
  showBanner('Partner status updated', 'blue');
}

function deleteBoy(username){
  if(confirm('Are you sure you want to delete delivery partner @' + username + '?')) {
    db.ref('deliveryAccounts/' + username).remove();
    showBanner('Partner deleted', 'red');
  }
}

function loadAdminOrders(){
  db.ref('orders').on('value', function(snap){
    var ordersListEl = document.getElementById('adminOrdersList');
    ordersListEl.innerHTML = '';
    
    var totalOrders = 0;
    var totalRevenue = 0;
    var activeCount = 0;
    
    if(!snap.exists()){
      ordersListEl.innerHTML = '<p class="text-center text-gray-400 text-sm py-6">No orders found.</p>';
      document.getElementById('statTotalOrders').textContent = '0';
      document.getElementById('statTotalRevenue').textContent = '₹0';
      document.getElementById('activeOrdersCount').textContent = '0 Active';
      return;
    }
    
    var orderKeys = [];
    snap.forEach(function(child){
      orderKeys.push({key: child.key, val: child.val()});
    });
    
    // Sort orders descending (newest first)
    orderKeys.reverse();
    
    orderKeys.forEach(function(item){
      var k = item.key;
      var o = item.val;
      
      totalOrders++;
      if(o.status !== 'cancelled') {
        totalRevenue += parseFloat(o.totalAmount || 0);
      }
      if(o.status !== 'completed' && o.status !== 'settled' && o.status !== 'cancelled'){
        activeCount++;
      }
      
      var assignedName = o.assignedName || o.assignedTo || 'Unassigned';
      var statusColor = o.status === 'completed' ? 'bg-green-100 text-green-700' : o.status === 'cancelled' ? 'bg-red-100 text-red-700' : 'bg-orange-100 text-orange-700';
      
      // Build options for delivery assignment dropdown
      var partnerOptions = '<option value="">-- Choose Delivery Partner --</option>';
      for(var bKey in activeDeliveryPartners){
        var isSelected = (o.assignedTo === bKey) ? 'selected' : '';
        partnerOptions += '<option value="' + bKey + '" ' + isSelected + '>' + activeDeliveryPartners[bKey] + ' (@' + bKey + ')</option>';
      }
      
      var oDiv = document.createElement('div');
      oDiv.className = 'bg-white rounded-2xl border p-4 shadow-sm space-y-3';
      oDiv.innerHTML = 
        '<div class="flex justify-between items-start">' +
          '<div>' +
            '<p class="font-black text-gray-800 text-sm">' + (o.customerName || 'Customer') + ' <span class="text-xs font-normal text-gray-500">(' + (o.customerPhone || 'No phone') + ')</span></p>' +
            '<p class="text-[10px] text-gray-400 mt-0.5">' + (o.items || 'No items description') + '</p>' +
          '</div>' +
          '<div class="text-right">' +
            '<p class="font-black text-base text-gray-800">₹' + (o.totalAmount || 0) + '</p>' +
            '<span class="text-[9px] font-black px-2 py-0.5 rounded-full uppercase ' + statusColor + '">' + (o.status || 'pending') + '</span>' +
          '</div>' +
        '</div>' +
        (o.address ? '<div class="bg-gray-50 p-2.5 rounded-xl text-xs text-gray-600">📍 ' + o.address + '</div>' : '') +
        '<div class="border-t pt-2.5 flex flex-col sm:flex-row items-center justify-between gap-2">' +
          '<div class="w-full sm:w-auto flex-1">' +
            '<label class="text-[9px] font-black text-gray-400 uppercase block mb-1">Assign to Delivery Partner:</label>' +
            '<select onchange="assignOrderToPartner(\'' + k + '\', this.value)" class="w-full text-xs font-bold border-2 rounded-xl p-2 bg-gray-50 focus:outline-none focus:border-blue-500">' +
              partnerOptions +
            '</select>' +
          '</div>' +
          '<div class="w-full sm:w-auto flex gap-2 justify-end mt-2 sm:mt-0">' +
            '<button onclick="updateOrderStatus(\'' + k + '\', \'cancelled\')" class="px-3 py-2 bg-red-50 text-red-600 rounded-xl font-black text-xs uppercase">Cancel</button>' +
          '</div>' +
        '</div>';
      ordersListEl.appendChild(oDiv);
    });
    
    document.getElementById('statTotalOrders').textContent = totalOrders;
    document.getElementById('statTotalRevenue').textContent = '₹' + totalRevenue;
    document.getElementById('activeOrdersCount').textContent = activeCount + ' Active';
  });
}

function assignOrderToPartner(orderKey, boyUsername){
  if(!boyUsername){
    db.ref('orders/' + orderKey).update({
      assignedTo: null,
      assignedName: null,
      assignedPhone: null
    });
    showBanner('Order unassigned', 'blue');
    return;
  }
  
  db.ref('deliveryAccounts/' + boyUsername).once('value', function(snap){
    if(!snap.exists()) return;
    var boy = snap.val();
    db.ref('orders/' + orderKey).update({
      assignedTo: boyUsername,
      assignedName: boy.name || boyUsername,
      assignedPhone: boy.phone || '',
      status: 'out_for_delivery'
    }, function(err){
      if(!err){
        showBanner('✅ Order assigned to ' + (boy.name || boyUsername) + ' successfully!', 'green');
      }
    });
  });
}

function updateOrderStatus(orderKey, status){
  if(!confirm('Are you sure you want to mark this order as ' + status + '?')) return;
  db.ref('orders/' + orderKey).update({ status: status }, function(err){
    if(!err) showBanner('Order status updated to ' + status, 'blue');
  });
}

// Initial load call
initAdminData();
</script>
</body>
</html>
