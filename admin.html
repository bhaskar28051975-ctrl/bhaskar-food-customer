<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - The Grill on Duty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .animate-in { animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(20px); opacity:0; } to { transform: translateY(0); opacity:1; } }
    </style>
</head>
<body class="bg-red-50 pb-24 p-4">
<div class="max-w-md mx-auto space-y-6">

    <!-- ADD HOTEL CARD -->
    <div class="bg-white p-6 rounded-[2rem] shadow-xl border space-y-3">
        <h2 class="font-black text-gray-800 uppercase text-xs tracking-widest">🏨 Add New Hotel</h2>
        <input id="resName" type="text" placeholder="Hotel Name" class="w-full p-3 border rounded-xl bg-gray-50 text-sm">
        <input id="resImg" type="text" placeholder="Hotel Image URL" class="w-full p-3 border rounded-xl bg-gray-50 text-sm">
        <button onclick="addRestaurant()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase shadow-lg active:scale-95 transition-transform">💾 Save Hotel</button>
    </div>

    <h2 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-2">Managed Hotels & Menus</h2>
    <div id="admin-restaurant-list" class="space-y-4"></div>
</div>

<!-- ── ADD / EDIT MENU ITEM MODAL ── -->
<div id="menuModal" class="modal-overlay fixed inset-0 z-50 hidden flex items-end justify-center">
    <div class="bg-white w-full max-w-md rounded-t-[2rem] p-6 space-y-4 animate-in">
        <div class="flex justify-between items-center">
            <h3 id="modalTitle" class="font-black text-gray-800 text-base uppercase">Add Menu Item</h3>
            <button onclick="closeModal()" class="text-gray-400 text-xl">✕</button>
        </div>
        <input id="mDish"  type="text"   placeholder="Dish Name *"  class="w-full p-3 border rounded-xl bg-gray-50 text-sm">
        <input id="mPrice" type="number" placeholder="Price (₹) *"  class="w-full p-3 border rounded-xl bg-gray-50 text-sm">
        <input id="mImg"   type="text"   placeholder="Image URL (optional)" class="w-full p-3 border rounded-xl bg-gray-50 text-sm">
        <!-- Image preview -->
        <div id="imgPreviewWrap" class="hidden">
            <img id="imgPreview" src="" class="w-full h-36 object-cover rounded-xl border"/>
        </div>
        <button onclick="previewImage()" class="text-xs text-red-500 font-bold underline">Preview Image</button>
        <button id="modalSaveBtn" onclick="saveMenuItem()" class="w-full bg-red-600 text-white py-4 rounded-xl font-black uppercase shadow-lg active:scale-95 transition-transform">💾 Save Item</button>
    </div>
</div>

<!-- ── FULL MENU VIEW MODAL ── -->
<div id="fullMenuModal" class="modal-overlay fixed inset-0 z-50 hidden flex items-end justify-center">
    <div class="bg-white w-full max-w-md rounded-t-[2rem] p-6 animate-in" style="max-height:85vh;overflow-y:auto">
        <div class="flex justify-between items-center mb-4 sticky top-0 bg-white pb-2">
            <h3 id="fullMenuTitle" class="font-black text-gray-800 text-base uppercase">Menu Items</h3>
            <button onclick="closeFullMenu()" class="text-gray-400 text-xl">✕</button>
        </div>
        <button onclick="openAddModal()" class="w-full bg-green-600 text-white py-3 rounded-xl font-black text-xs uppercase mb-4 active:scale-95 transition-transform">＋ Add New Dish</button>
        <div id="fullMenuList" class="space-y-3"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, remove, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAT074ME7aIbb4R2VzgZZGdw8F3alL-xbA",
    authDomain: "bhaskar-food-app.firebaseapp.com",
    databaseURL: "https://bhaskar-food-app-default-rtdb.firebaseio.com",
    projectId: "bhaskar-food-app",
    appId: "1:712053690568:web:b4d8b789e0359ebc0e95fd"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let currentResId  = null;   // which restaurant we are editing
let editingItemId = null;   // null = adding new, else = item key being edited

// ── LOAD FULL DEFAULT MENU ──
window.loadFullMenu = async (id) => {
    if(!confirm("This will DELETE the current menu and add the NEW items. Proceed?")) return;
    await remove(ref(db, `restaurants/${id}/menu`));
    const newMenu = [
        { dish: "Veg Manchow Soup",       price: 150, img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=400" },
        { dish: "Hot n Sour Soup",         price: 160, img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=400" },
        { dish: "Paneer Tikka",            price: 300, img: "https://images.unsplash.com/photo-1567184109191-378eb2446c53?w=400" },
        { dish: "Mushroom Tikka",          price: 250, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=400" },
        { dish: "Classic Paneer Shawarma", price: 120, img: "https://images.unsplash.com/photo-1642935222650-693bc3e5c1bb?w=400" },
        { dish: "Classic Mexican Shawarma",price: 140, img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=400" },
        { dish: "VEG Biryani",             price: 220, img: "https://images.unsplash.com/photo-1563379091339-03b21bc4a4f8?w=400" },
        { dish: "Paneer Biryani",          price: 270, img: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=400" },
        { dish: "Veg Noodles",             price: 140, img: "https://images.unsplash.com/photo-1585032226651-759b368d7246?w=400" },
        { dish: "Veg Fried Rice",          price: 140, img: "https://images.unsplash.com/photo-1512058560366-cd24270083cd?w=400" },
        { dish: "Butter Naan",             price:  45, img: "https://images.unsplash.com/photo-1601050690597-df056fb1d99a?w=400" },
    ];
    newMenu.forEach(item => push(ref(db, `restaurants/${id}/menu`), { dish: item.dish, price: item.price, dishImg: item.img }));
    alert("Menu Cleared and Updated Successfully!");
};

// ── ADD HOTEL ──
window.addRestaurant = () => {
    const name  = document.getElementById('resName').value.trim();
    const image = document.getElementById('resImg').value.trim();
    if(!name) return alert("Please enter hotel name!");
    push(ref(db, 'restaurants'), { name, image: image || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400" });
    document.getElementById('resName').value = "";
    document.getElementById('resImg').value  = "";
};

// ── DELETE HOTEL ──
window.deleteHotel = (id) => { if(confirm("Delete Hotel?")) remove(ref(db, `restaurants/${id}`)); };

// ── OPEN FULL MENU MODAL ──
window.openFullMenu = (resId, resName) => {
    currentResId = resId;
    document.getElementById('fullMenuTitle').textContent = '🍽️ ' + resName;
    document.getElementById('fullMenuModal').classList.remove('hidden');
    loadMenuItems(resId);
};
window.closeFullMenu = () => {
    document.getElementById('fullMenuModal').classList.add('hidden');
    currentResId = null;
};

function loadMenuItems(resId) {
    onValue(ref(db, `restaurants/${resId}/menu`), (snap) => {
        const list = document.getElementById('fullMenuList');
        list.innerHTML = "";
        if(!snap.exists()) {
            list.innerHTML = '<p class="text-center text-gray-400 text-sm py-8">No menu items yet.<br>Tap Add New Dish above!</p>';
            return;
        }
        snap.forEach(child => {
            const m   = child.val();
            const key = child.key;
            list.innerHTML += `
            <div class="flex items-center gap-3 bg-gray-50 rounded-2xl p-3 border animate-in">
                <img src="${m.dishImg || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'}"
                     onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'"
                     class="w-16 h-16 rounded-xl object-cover flex-shrink-0"/>
                <div class="flex-1 min-w-0">
                    <p class="font-black text-sm text-gray-800 truncate">${m.dish}</p>
                    <p class="text-red-600 font-bold text-sm">₹${m.price}</p>
                </div>
                <div class="flex flex-col gap-2">
                    <button onclick="openEditModal('${key}','${m.dish.replace(/'/g,"\\'")}',${m.price},'${(m.dishImg||'').replace(/'/g,"\\'")}' )"
                        class="bg-blue-500 text-white px-3 py-1.5 rounded-lg text-[10px] font-black uppercase active:scale-95">
                        ✏️ Edit
                    </button>
                    <button onclick="deleteMenuItem('${key}')"
                        class="bg-red-500 text-white px-3 py-1.5 rounded-lg text-[10px] font-black uppercase active:scale-95">
                        🗑️ Delete
                    </button>
                </div>
            </div>`;
        });
    }, { onlyOnce: true });
}

// ── OPEN ADD MODAL ──
window.openAddModal = () => {
    editingItemId = null;
    document.getElementById('modalTitle').textContent    = '➕ Add New Dish';
    document.getElementById('modalSaveBtn').textContent  = '💾 Save Item';
    document.getElementById('mDish').value  = '';
    document.getElementById('mPrice').value = '';
    document.getElementById('mImg').value   = '';
    document.getElementById('imgPreviewWrap').classList.add('hidden');
    document.getElementById('menuModal').classList.remove('hidden');
};

// ── OPEN EDIT MODAL ──
window.openEditModal = (key, dish, price, img) => {
    editingItemId = key;
    document.getElementById('modalTitle').textContent   = '✏️ Edit Dish';
    document.getElementById('modalSaveBtn').textContent = '✅ Update Item';
    document.getElementById('mDish').value  = dish;
    document.getElementById('mPrice').value = price;
    document.getElementById('mImg').value   = img;
    if(img) {
        document.getElementById('imgPreview').src = img;
        document.getElementById('imgPreviewWrap').classList.remove('hidden');
    } else {
        document.getElementById('imgPreviewWrap').classList.add('hidden');
    }
    document.getElementById('menuModal').classList.remove('hidden');
};

window.closeModal = () => {
    document.getElementById('menuModal').classList.add('hidden');
    editingItemId = null;
};

// ── PREVIEW IMAGE ──
window.previewImage = () => {
    const url = document.getElementById('mImg').value.trim();
    if(!url) return alert("Please enter an image URL first!");
    document.getElementById('imgPreview').src = url;
    document.getElementById('imgPreviewWrap').classList.remove('hidden');
};

// ── SAVE (ADD or EDIT) MENU ITEM ──
window.saveMenuItem = async () => {
    const dish  = document.getElementById('mDish').value.trim();
    const price = parseFloat(document.getElementById('mPrice').value);
    const img   = document.getElementById('mImg').value.trim();

    if(!dish)       return alert("⚠️ Please enter dish name!");
    if(!price || isNaN(price)) return alert("⚠️ Please enter a valid price!");
    if(!currentResId) return;

    const data = {
        dish,
        price,
        dishImg: img || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400"
    };

    if(editingItemId) {
        // UPDATE existing item
        await set(ref(db, `restaurants/${currentResId}/menu/${editingItemId}`), data);
        alert("✅ Dish updated successfully!");
    } else {
        // ADD new item
        await push(ref(db, `restaurants/${currentResId}/menu`), data);
        alert("✅ Dish added successfully!");
    }

    closeModal();
    loadMenuItems(currentResId);
};

// ── DELETE MENU ITEM ──
window.deleteMenuItem = async (key) => {
    if(!confirm("🗑️ Delete this dish?")) return;
    await remove(ref(db, `restaurants/${currentResId}/menu/${key}`));
    alert("Dish deleted!");
    loadMenuItems(currentResId);
};

// ── RENDER HOTEL LIST ──
onValue(ref(db, 'restaurants'), (snap) => {
    const list = document.getElementById('admin-restaurant-list');
    list.innerHTML = "";
    if(!snap.exists()) {
        list.innerHTML = '<p class="text-center text-gray-400 text-sm py-6">No hotels added yet.</p>';
        return;
    }
    snap.forEach(child => {
        const res     = child.val();
        const hotelId = child.key;
        const menuCount = res.menu ? Object.keys(res.menu).length : 0;
        list.innerHTML += `
        <div class="p-4 bg-white rounded-2xl shadow-sm border mb-4 animate-in">
            <div class="flex items-center gap-3 mb-3">
                <img src="${res.image}" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400'"
                     class="w-14 h-14 rounded-xl object-cover flex-shrink-0"/>
                <div>
                    <p class="font-black text-sm uppercase text-red-600">${res.name}</p>
                    <p class="text-xs text-gray-400">${menuCount} item${menuCount!==1?'s':''} in menu</p>
                </div>
            </div>

            <!-- MANAGE MENU BUTTON -->
            <button onclick="openFullMenu('${hotelId}','${res.name.replace(/'/g,"\\'")}' )"
                class="w-full bg-blue-600 text-white py-3 rounded-xl font-black text-xs uppercase shadow-md active:scale-95 mb-2">
                🍽️ Manage Menu (Add / Edit / Delete)
            </button>

            <!-- LOAD DEFAULT MENU -->
            <button onclick="loadFullMenu('${hotelId}')"
                class="w-full bg-green-600 text-white py-3 rounded-xl font-black text-[10px] uppercase shadow-md active:scale-95 mb-2">
                🔄 Reset & Load Default Menu
            </button>

            <!-- DELETE HOTEL -->
            <button onclick="deleteHotel('${hotelId}')"
                class="w-full mt-1 text-gray-400 text-[9px] font-bold uppercase underline">
                🗑️ Remove Hotel
            </button>
        </div>`;
    });
});
</script>
</body>
</html>
